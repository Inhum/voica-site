<!-- Источник картинки-тизера для поста на Boosty (1150×1250 — двойной размер от
     рекомендованных площадкой 575×625, чтобы не мылилось на ретине).
     Правь тут и перегенери:
     "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new \
       --disable-gpu --hide-scrollbars --force-device-scale-factor=1 --virtual-time-budget=3500 \
       --window-size=1150,1250 --screenshot="posters/boosty-teaser.png" "file://$PWD/posters/boosty-teaser.html"
     Стиль — по BRAND.md, как у обложки: бумага/чернила, синий акцент, циан-волна линиями.
     Смысл держим по центру: Boosty режет края тизера по-разному на разных экранах. -->
<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../assets/css/fonts.css">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1150px;height:1250px;overflow:hidden}
  body{
    position:relative;
    background:#0E1116;
    background-image:radial-gradient(900px 700px at 50% -8%, #1b2740 0%, rgba(27,39,64,0) 62%);
    color:#ECEFF3;
    font-family:"Golos Text",-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:0 86px;text-align:center;
  }

  /* Знак — иконка приложения (волна в скруглённом квадрате, тот же файл, что фавикон сайта).
     Вордмарка тут НЕТ намеренно: название уже звучит в слогане, а два «Voica» подряд —
     это не бренд, а тавтология. */
  .mark{width:136px;height:136px;margin-bottom:62px;display:block}

  h1{font-family:"Onest",sans-serif;font-weight:700;font-size:82px;line-height:1.08;
     letter-spacing:-.025em}
  h1 em{font-style:normal;color:#4E93FF}
  .sub{font-size:34px;color:#98A2B3;margin-top:30px;line-height:1.35}

  /* Осциллограмма-разделитель: фирменный мотив линиями, без заливок и свечения. */
  .osc{display:flex;align-items:center;justify-content:center;gap:6px;height:96px;margin:58px 0 54px;
       opacity:.55;
       -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 14%,#000 86%,transparent 100%)}
  .osc i{width:4px;border-radius:3px;background:#45CEEB;flex:none}

  .chips{display:flex;flex-wrap:wrap;gap:14px;justify-content:center}
  .chip{font-family:"JetBrains Mono",monospace;font-weight:500;font-size:23px;color:#98A2B3;
        background:#161C24;border:1px solid #242B35;padding:12px 20px;border-radius:10px}

  .site{position:absolute;bottom:64px;font-family:"Onest",sans-serif;font-weight:600;
        font-size:30px;color:#4E93FF;letter-spacing:.01em}
</style>
</head>
<body>
  <svg class="mark" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
    <defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B8DF0"/><stop offset="1" stop-color="#1A6BE0"/></linearGradient></defs>
    <rect width="64" height="64" rx="15" fill="url(#g)"/>
    <g fill="#fff">
      <rect x="14" y="27" width="5" height="10" rx="2.5"/>
      <rect x="23" y="20" width="5" height="24" rx="2.5"/>
      <rect x="32" y="14" width="5" height="36" rx="2.5"/>
      <rect x="41" y="22" width="5" height="20" rx="2.5"/>
      <rect x="50" y="28" width="5" height="8" rx="2.5" fill="#8FD6EA"/>
    </g>
  </svg>

  <h1>Говори —<br><em>Voica напечатает</em></h1>
  <div class="sub">Диктовка с пунктуацией<br>для macOS и Windows</div>

  <div class="osc" id="osc"></div>

  <div class="chips">
    <div class="chip">офлайн-движок</div>
    <div class="chip">open source</div>
    <div class="chip">бесплатно</div>
  </div>

  <div class="site">voica.ru</div>

<script>
// Детерминированная «речевая» огибающая — картинка повторяется один в один при перегенерации.
const n = 74, box = document.getElementById('osc');
for (let i = 0; i < n; i++) {
  const t = i / (n - 1);
  const env = Math.sin(Math.PI * t) ** 0.6;
  const v = Math.abs(Math.sin(t * 21) * 0.55 + Math.sin(t * 7.7) * 0.45);
  const bar = document.createElement('i');
  bar.style.height = Math.max(5, 96 * env * v) + 'px';
  box.appendChild(bar);
}
</script>
</body>
</html>
