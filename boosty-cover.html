<!-- Источник обложки канала на Boosty (1920×240 — формат площадки, узкая полоса 8:1).
     Правь тут и перегенери:
     "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new \
       --disable-gpu --hide-scrollbars --force-device-scale-factor=1 --virtual-time-budget=3500 \
       --window-size=1920,240 --screenshot="boosty-cover.png" "file://$PWD/boosty-cover.html"
     Стиль — по BRAND.md: бумага/чернила, синий акцент, циан-волна ЛИНИЯМИ (не заливкой),
     без фиолетовых градиентов и glow. Смысловое — по центру: на мобиле края обрезаются. -->
<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/css/fonts.css">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1920px;height:240px;overflow:hidden}
  body{
    position:relative;
    background:#0E1116;
    background-image:radial-gradient(1200px 420px at 50% -40%, #1b2740 0%, rgba(27,39,64,0) 62%);
    color:#ECEFF3;
    font-family:"Golos Text",-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;
    display:flex;align-items:center;justify-content:center;
  }

  /* Осциллограмма во всю ширину — фирменный мотив. Маска выедает СЕРЕДИНУ: там текст, и
     полоса под ним превращала бы его в кашу. Заодно правильно для мобилы — смысл в центре,
     по краям только декор, который и обрезается. */
  .osc{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:6px;
       opacity:.45;
       -webkit-mask-image:linear-gradient(90deg,
           transparent 0, #000 6%, #000 15%, transparent 22%,
           transparent 78%, #000 85%, #000 94%, transparent 100%)}
  .osc i{width:3px;border-radius:3px;background:#45CEEB;flex:none}

  /* Центральный замок: знак приложения, справа — текст через разделитель.
     Вордмарка тут НЕТ намеренно: название звучит в слогане, два «Voica» подряд — тавтология.
     Знак — та же иконка, что в Dock и в фавиконе сайта: её и запоминают. */
  .lockup{position:relative;display:flex;align-items:center;gap:34px}
  /* Размер знака = высота двух строк текста справа: иконка не должна доминировать над
     сообщением, а на странице она ещё и соседствует с аватаркой автора. */
  .mark{width:78px;height:78px;display:block;flex:none}

  .rule{width:1px;height:66px;background:#242B35}

  .copy h1{font-family:"Onest",sans-serif;font-weight:700;font-size:38px;line-height:1.1;
           letter-spacing:-.02em}
  .copy h1 em{font-style:normal;color:#4E93FF}
  .copy p{font-size:20px;color:#98A2B3;margin-top:9px;line-height:1.3}
  .copy p b{font-weight:500;color:#ECEFF3}
</style>
</head>
<body>
  <div class="osc" id="osc"></div>

  <div class="lockup">
    <svg class="mark" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
      <defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#3B8DF0"/><stop offset="1" stop-color="#1A6BE0"/></linearGradient></defs>
      <rect width="64" height="64" rx="15" fill="url(#g)"/>
      <g fill="#fff">
        <rect x="14" y="27" width="5" height="10" rx="2.5"/>
        <rect x="23" y="20" width="5" height="24" rx="2.5"/>
        <rect x="32" y="14" width="5" height="36" rx="2.5"/>
        <rect x="41" y="22" width="5" height="20" rx="2.5"/>
        <rect x="50" y="28" width="5" height="8" rx="2.5" fill="#8FD6EA"/>
      </g>
    </svg>
    <div class="rule"></div>
    <div class="copy">
      <h1>Говори — <em>Voica напечатает</em></h1>
      <p>Диктовка с пунктуацией для macOS и Windows · <b>бесплатно, без подписки</b></p>
    </div>
  </div>

<script>
// Столбики осциллограммы: детерминированная «речевая» огибающая, чтобы картинка
// повторялась один в один при каждой перегенерации.
const n = 150, box = document.getElementById('osc');
for (let i = 0; i < n; i++) {
  const t = i / (n - 1);
  const env = Math.sin(Math.PI * t) ** 0.7;                     // затухание к краям
  const v = Math.abs(Math.sin(t * 34) * 0.55 + Math.sin(t * 11.3) * 0.45);
  const bar = document.createElement('i');
  bar.style.height = Math.max(4, 150 * env * v) + 'px';
  box.appendChild(bar);
}
</script>
</body>
</html>
