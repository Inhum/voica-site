<!-- Источник EN og-картинки (assets/img/og.en.png). Правь тут и перегенери:
     "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new \
       --disable-gpu --hide-scrollbars --force-device-scale-factor=1 --virtual-time-budget=3500 \
       --window-size=1200,630 --screenshot="assets/img/og.en.png" "file://$PWD/og-en.html"
     RU-версия (og.png) — отдельная картинка без исходника в репо. -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/css/fonts.css">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1200px;height:630px}
  body{
    font-family:"Golos Text",-apple-system,sans-serif;
    background:#0E1116;
    background-image:radial-gradient(1100px 620px at 22% -12%, #1c2740 0%, rgba(28,39,64,0) 58%);
    color:#ECEFF3;
    padding:86px 90px;
    display:flex;flex-direction:column;justify-content:center;
    -webkit-font-smoothing:antialiased;
  }
  .brand{display:flex;align-items:flex-end;gap:12px;margin-bottom:30px}
  .wave{display:inline-flex;align-items:flex-end;gap:4px;height:34px}
  .wave i{width:5px;border-radius:4px;background:#45CEEB}
  .wave i:nth-child(1){height:38%}.wave i:nth-child(2){height:78%}.wave i:nth-child(3){height:100%}
  .wave i:nth-child(4){height:56%}.wave i:nth-child(5){height:84%}
  .brand span{font-family:"Onest",sans-serif;font-weight:700;font-size:38px;letter-spacing:-.01em;line-height:1}
  h1{font-family:"Onest",sans-serif;font-weight:700;font-size:80px;line-height:1.04;letter-spacing:-.025em}
  h1 .accent{color:#4E93FF}
  .sub{font-family:"Golos Text",sans-serif;font-weight:400;font-size:29px;color:#98A2B3;margin-top:28px;line-height:1.35;max-width:1000px}
  .chips{display:flex;gap:12px;margin-top:34px}
  .chip{font-family:"JetBrains Mono",monospace;font-weight:500;font-size:18px;color:#98A2B3;background:#1B222C;border:1px solid #242B35;padding:9px 16px;border-radius:10px}
</style>
</head>
<body>
  <div class="brand"><span class="wave"><i></i><i></i><i></i><i></i><i></i></span><span>Voica</span></div>
  <h1>Voice dictation<br><span class="accent">with punctuation</span></h1>
  <div class="sub">For Mac &amp; Windows. In the cloud via Groq Whisper — or fully offline.</div>
  <div class="chips">
    <div class="chip">offline engine · GigaAM</div>
    <div class="chip">open source</div>
    <div class="chip">your own key</div>
  </div>
</body>
</html>
